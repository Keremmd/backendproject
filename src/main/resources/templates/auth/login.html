<!DOCTYPE html>
<html lang="tr"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::content}, 'Giriş')}">
<body>
<th:block th:fragment="content">

    <div class="auth-shell">
        <div class="auth-card">
            <h1>Tekrar hoş geldin 👋</h1>
            <p class="sub">EgeQuiz hesabına giriş yap.</p>

            <div th:if="${param.error}"      class="alert alert-error mb-2">Kullanıcı adı veya şifre hatalı.</div>
            <div th:if="${param.logout}"     class="alert alert-info  mb-2">Başarıyla çıkış yaptın.</div>
            <div th:if="${param.registered}" class="alert alert-success mb-2">Kayıt tamamlandı! Şimdi giriş yapabilirsin.</div>

            <form th:action="@{/login}" method="post" class="form">
                <div class="form-group">
                    <label for="username">Kullanıcı adı</label>
                    <input id="username" name="username" class="input" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Şifre</label>
                    <input id="password" name="password" type="password" class="input" required>
                </div>
                <button class="btn btn-primary btn-block btn-lg" type="submit">Giriş Yap</button>
            </form>

            <hr class="divider">
            <p class="text-muted text-center" style="margin:0">
                Hesabın yok mu? <a th:href="@{/register}">Kayıt ol</a>
            </p>

            <details class="mt-3">
                <summary class="text-muted" style="cursor:pointer; font-size:.85rem">Demo hesapları</summary>
                <div class="mt-1 text-muted" style="font-size:.85rem">
                    <div><strong>Admin:</strong> admin / admin123</div>
                    <div><strong>Kullanıcı:</strong> kerem / kerem123</div>
                </div>
            </details>
        </div>
    </div>

</th:block>
</body>
</html>
