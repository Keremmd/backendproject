spring.application.name=EgeQuiz
server.port=8080

# H2 in-memory database (no setup required)
spring.datasource.url=jdbc:h2:mem:egequizdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Şablonda lazy ilişkilere erişebilmek için OSIV açık (akademik proje, basitlik için).
spring.jpa.open-in-view=true

# H2 web console (browse at /h2-console while developing)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf
spring.thymeleaf.cache=false

# Logging
logging.level.org.hibernate.SQL=warn
logging.level.org.springframework.security=warn
